<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree Viewer - Admin</title>
    <link rel="stylesheet" href="../family-tree-styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --panel: #12121a;
            --card: #1a1a24;
            --line: rgba(255, 255, 255, 0.08);
            --text: #e5e7eb;
            --muted: #9ca3af;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --blue: #60a5fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 32px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .button {
            padding: 10px 20px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--blue);
        }

        .main-content {
            flex: 1;
            padding: 20px;
        }

        #treeContainer {
            height: calc(100vh - 140px);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Family Tree Viewer</h1>
        <div class="header-actions">
            <a href="family-tree-manager.html" class="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                Manage Members
            </a>
            <a href="admin.html" class="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
                Back to Admin
            </a>
        </div>
    </header>

    <div class="main-content">
        <div id="treeContainer" class="tree-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="../supabase-config.js"></script>
    <script src="../family-tree-renderer.js"></script>
    <script>
        // Initialize family tree on page load
        document.addEventListener('DOMContentLoaded', async () => {
            // Check admin auth
            const { data: { user }, error: authError } = await supabase.auth.getUser();
            
            if (authError || !user) {
                alert('Please login as admin');
                window.location.href = '../family-member-login.html';
                return;
            }

            const { data: adminData, error: adminError } = await supabase
                .from('admin_users')
                .select('*')
                .eq('user_id', user.id)
                .single();

            if (adminError || !adminData) {
                alert('Unauthorized: Admin access required');
                window.location.href = '../family-member-login.html';
                return;
            }

            // Get member ID from URL if provided
            const urlParams = new URLSearchParams(window.location.search);
            const focusMemberId = urlParams.get('member');

            // Initialize tree
            try {
                const renderer = new FamilyTreeRenderer('treeContainer', {
                    cardWidth: 200,
                    cardHeight: 120,
                    horizontalGap: 40,
                    verticalGap: 100,
                    showRelationshipLabels: true,
                    showGenerationNumbers: true,
                    showSpouseConnections: true,
                    showParentChildConnections: true,
                    centerTree: true,
                    enableZoom: true,
                    enablePan: true
                });

                await renderer.loadData(focusMemberId);
            } catch (error) {
                console.error('Failed to initialize tree:', error);
                alert('Failed to load family tree: ' + error.message);
            }
        });
    </script>
</body>
</html>
