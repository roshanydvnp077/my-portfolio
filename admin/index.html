<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><style>:root{color-scheme:dark;--bg:#080b14;--panel:#111827e8;--line:#94a3b82b;--text:#f8fafc;--muted:#94a3b8;--blue:#60a5fa}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--text);background:radial-gradient(circle at 10% 0,#2563eb33,transparent 30rem),var(--bg);font:14px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:24px 14px;border-right:1px solid var(--line);background:#080b14e8}.brand{padding:0 10px 18px;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.12em}.brand small,.eyebrow{display:block;color:var(--blue);font-size:.72rem;letter-spacing:0}.nav{display:grid;gap:4px;margin-top:18px}.nav button,.side a{border:0;border-radius:8px;padding:10px;color:#cbd5e1;background:transparent;text-align:left;text-decoration:none}.nav button.active,.nav button:hover{color:#fff;background:#2563eb44}.side-bottom{display:grid;gap:8px;margin-top:40px}.side-bottom button,.button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:#dbeafe;background:#ffffff0d;text-decoration:none}.main{min-width:0;padding:28px clamp(14px,4vw,48px)}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:28px}h1,h2,h3,p{margin:0}h1{font-size:2.3rem}.view[hidden],[hidden]{display:none!important}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}.stat,.panel,.card{border:1px solid var(--line);border-radius:13px;background:var(--panel)}.stat{padding:14px}.stat span{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase}.stat b{font-size:1.6rem}.panel{padding:18px;margin-bottom:16px}.toolbar,.actions,.row-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:9px;margin-bottom:14px}.primary{border-color:transparent;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--text);background:#ffffff0d}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{display:grid;gap:5px;color:var(--muted);font-size:.78rem}.full{grid-column:1/-1}textarea.field{min-height:90px}.table{overflow:auto}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-size:.7rem;text-transform:uppercase}.row-actions button{border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:#dbeafe;background:#ffffff0d}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{padding:12px}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px}.empty{padding:30px;color:var(--muted);text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#020617cc;z-index:3}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line);border-radius:12px;background:#111827}.dialog-head{display:flex;justify-content:space-between;margin-bottom:14px}.close{border:0;background:none;color:var(--muted);font-size:1.3rem}.status{min-height:22px}.error{color:#fca5a5}.success{color:#86efac}#toast{position:fixed;right:18px;bottom:18px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#172033;z-index:4}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.side{position:fixed;inset:0 auto 0 -250px;width:235px;z-index:2;transition:left .2s}.side.open{left:0}.menu{display:inline-block}.main{padding:16px 12px}.form,.cards,.stats{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-direction:column}}</style></head><body><div class="app" id="app" hidden><aside class="side" id="side"><div class="brand">PORTFOLIO ADMIN<small>Roshan Yadav</small></div><nav class="nav"><button data-view="dashboard">Dashboard</button><button data-view="messages">Messages</button><button data-view="projects">Projects</button><button data-view="gallery">Gallery</button><button data-view="documents">Documents</button><button data-view="skills">Skills</button><button data-view="services">Services</button><button data-view="journey">Journey</button><button data-view="profile">Profile</button><button data-view="settings">Settings</button></nav><div class="side-bottom"><a href="../index.html">View Website</a><button id="logout">Logout</button></div></aside><main class="main"><header class="top"><div><button class="button menu" id="menu" hidden>Menu</button><p class="eyebrow">Control room</p><h1 id="title">Dashboard</h1><p class="muted">Manage the live portfolio content.</p></div><span class="muted" id="account"></span></header><section class="view" id="dashboardView"></section><section class="view" id="messagesView" hidden></section><section class="view" id="projectsView" hidden></section><section class="view" id="galleryView" hidden></section><section class="view" id="documentsView" hidden></section><section class="view" id="skillsView" hidden></section><section class="view" id="servicesView" hidden></section><section class="view" id="journeyView" hidden></section><section class="view" id="profileView" hidden></section><section class="view" id="settingsView" hidden></section></main></div><div class="overlay" id="overlay" hidden><article class="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="close" id="dialogClose">x</button></div><div id="dialogBody"></div></article></div><div id="toast" hidden></div><script src="vendor/supabase.js"></script><script src="../supabase-config.js"></script><script src="admin.js"></script></body></html>
